[build-system]
requires = ['setuptools>=77', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'check_cmake'
requires-python = '>=3.9'
description = 'A simple linter for CMake.'
authors = [{ name = "Mark Gillard", email = "mark.gillard@outlook.com.au" }]
license = 'MIT'
license-files = ['LICENSE.txt']
keywords = ['c++', 'cmake']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Programming Language :: C',
    'Programming Language :: C++',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development :: Code Generators',
    'Topic :: Software Development :: Compilers',
    'Topic :: Software Development :: Build Tools',
    'Topic :: Utilities',
]
dependencies = ['misk >= 0.8.1', 'colorama']
dynamic = ['version', 'readme']

[project.optional-dependencies]
test = ['pytest']
dev = ['pytest', 'ruff == 0.15.14', 'pyright == 1.1.409', 'pre-commit']

[project.scripts]
check_cmake = 'check_cmake:main'
'check-cmake' = 'check_cmake:main'

[project.urls]
Source = 'https://github.com/marzer/check-cmake'
Tracker = 'https://github.com/marzer/check-cmake/issues'
Funding = 'https://github.com/sponsors/marzer'

[tool.setuptools]
zip-safe = true

[tool.setuptools.dynamic]
version = { file = 'VERSION' }
readme = { file = [
    'README.md',
    'CHANGELOG.md',
], content-type = 'text/markdown' }

[tool.setuptools.packages.find]
where = ["src"]
include = ["check_cmake*"]

[tool.ruff]
line-length = 120
target-version = 'py39'

[tool.ruff.format]
quote-style = 'preserve'
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ['F', 'E4', 'E7', 'E9', 'W', 'I', 'UP', 'B']
ignore = ['F403', 'F405', 'F541', 'E731', 'E741', 'B007', 'B023']

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']
addopts = '-ra'

[tool.pyright]
include = ['src/check_cmake', 'src/__main__.py', 'tests']
exclude = ['**/__pycache__', '**/.*', 'build', 'dist']
pythonVersion = '3.9'
typeCheckingMode = 'basic'
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportWildcardImportFromLibrary = false
