repos:
    - repo: local
      hooks:
          - id: ruff-check
            name: ruff check
            entry: ruff check --fix --force-exclude
            language: system
            types_or: [python, pyi]
            require_serial: true
          - id: ruff-format
            name: ruff format
            entry: ruff format --force-exclude
            language: system
            types_or: [python, pyi]
            require_serial: true

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-toml
          - id: check-yaml
          - id: end-of-file-fixer
            exclude: ^tests/(error|valid)/
          - id: trailing-whitespace
            exclude: ^tests/(error|valid)/|\.md$
          - id: mixed-line-ending
            args: [--fix=lf]
