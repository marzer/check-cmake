name: publish

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - name: Install build + test deps
              run: |
                  python -m pip install --upgrade pip build
                  python -m pip install '.[test]'
            - name: Run tests
              run: python -m pytest tests -ra
            - name: Build sdist + wheel
              run: python -m build
            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/

    publish:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/check-cmake
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
